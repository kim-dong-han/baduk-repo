<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />

    <title>바둑 AI 기보 분석</title>
    <meta
      name="description"
      content="KataGo 로 기보를 분석하고, 매 수의 승률과 대안을 바둑판 위에서 확인한다."
    />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fcfbf9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14110e" />

    <!-- 흑돌 하나. 외부 파일을 만들지 않으려고 인라인으로 둔다. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231a1a1f'/%3E%3Ccircle cx='11.5' cy='11' r='3.5' fill='%23ffffff' opacity='.22'/%3E%3C/svg%3E"
    />

    <!-- Pretendard dynamic subset. 실제로 쓰이는 글자만 내려받는다.
         셀프 호스팅으로 옮기려면 woff2 를 public/fonts 에 두고 @font-face 로 바꾼다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
